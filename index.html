<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مثوى | Executive Negotiation Dashboard</title>
  <link rel="icon" type="image/png" href="./Logo.png">
  <link rel="apple-touch-icon" href="./Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@1,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --espresso: #0F0A06;
      --card-bg: #1A1208;
      --card-elevated: #2D1E10;
      --gold: #C9A96E;
      --gold-light: #E8D4A8;
      --gold-dim: #6B5430;
      --gold-soft: rgba(201,169,110,0.12);
      --text-primary: #F5EDE0;
      --text-muted: rgba(245,237,224,0.5);
      --success: #95D5B2;
      --warning: #FFD166;
      --danger: #FCA5A5;
      --danger-bg: rgba(252,165,165,0.08);
      --hero-radial-1: rgba(201,169,110,0.22);
      --hero-radial-2: rgba(201,169,110,0.08);
      --surface-line: rgba(201,169,110,0.14);
      --surface-line-strong: rgba(201,169,110,0.32);
      --shadow-deep: rgba(0,0,0,0.34);
      --white-soft: rgba(255,255,255,0.05);
      --mask-fade: rgba(0,0,0,0.7);
      --toggle-bg: rgba(26,18,8,0.88);
      --gold-wash-10: rgba(201,169,110,0.1);
      --gold-wash-06: rgba(201,169,110,0.06);
      --gold-wash-04: rgba(201,169,110,0.04);
      --gold-wash-03: rgba(201,169,110,0.03);
      --gold-wash-025: rgba(201,169,110,0.025);
      --gold-border-soft: rgba(201,169,110,0.15);
      --text-surface-08: rgba(245,237,224,0.08);
      --text-surface-06: rgba(245,237,224,0.06);
      --danger-wash-72: rgba(252,165,165,0.72);
      --danger-wash-70: rgba(252,165,165,0.7);
      --danger-border-soft: rgba(252,165,165,0.2);
      --danger-border-mid: rgba(252,165,165,0.15);
      --danger-border-faint: rgba(252,165,165,0.12);
      --danger-border-strong: rgba(252,165,165,0.25);
      --danger-bg-soft: rgba(252,165,165,0.05);
      --danger-bg-faint: rgba(252,165,165,0.04);
      --warning-bg-soft: rgba(255,209,102,0.08);
      --warning-bg-mid: rgba(255,209,102,0.09);
      --warning-border-soft: rgba(255,209,102,0.24);
      --warning-border-mid: rgba(255,209,102,0.25);
      --steel: #566273;
      --steel-light: #9BA7B7;
      --steel-soft: rgba(155,167,183,0.12);
      --print-bg: #FFFFFF;
      --print-text: #18120F;
      --print-muted: rgba(24,18,15,0.65);
      --print-line: rgba(24,18,15,0.16);
      --print-line-strong: rgba(24,18,15,0.3);
      --print-grid: rgba(24,18,15,0.04);
      --branch-a: #C9A96E;
      --branch-b: #FFD166;
      --grid-accent: rgba(201,169,110,0.06);
      --chart-indirect: rgba(232,212,168,0.22);
      --danger-solid-soft: rgba(252,165,165,0.22);
      --lux-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-body: "Tajawal", sans-serif;
      --font-display: "Playfair Display", serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text-primary);
      background:
        radial-gradient(circle at top center, var(--hero-radial-1), transparent 34%),
        radial-gradient(circle at 15% 20%, var(--hero-radial-2), transparent 24%),
        linear-gradient(180deg, var(--espresso), var(--card-bg));
      line-height: 1.65;
      transition:
        background 500ms var(--lux-ease),
        color 500ms var(--lux-ease);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-accent) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-accent) 1px, transparent 1px);
      background-size: 120px 120px;
      mask-image: linear-gradient(180deg, var(--mask-fade), transparent 92%);
      opacity: 0.5;
    }

    button,
    a,
    canvas,
    .metric-card,
    .gauge-card,
    .insight-card,
    .marketing-card,
    .opportunity-card,
    .floor-card,
    .mini-stat-card,
    .link-button,
    .summary-tile {
      transition:
        color 320ms var(--lux-ease),
        background-color 320ms var(--lux-ease),
        border-color 320ms var(--lux-ease),
        transform 320ms var(--lux-ease),
        opacity 320ms var(--lux-ease),
        box-shadow 320ms var(--lux-ease);
    }

    .lang-toggle {
      position: fixed;
      inset-block-start: 1.5rem;
      inset-inline-end: 1.5rem;
      z-index: 20;
      border: 1px solid var(--surface-line-strong);
      background: var(--toggle-bg);
      color: var(--gold-light);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.72rem 1rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 18px 50px var(--shadow-deep);
    }

    .lang-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }

    .page {
      position: relative;
      width: min(1400px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3rem 0 2rem;
    }

    .hero {
      padding-top: 0.35rem;
    }

    .hero-grid,
    .gap-grid,
    .cost-grid,
    .charts-grid,
    .insights-grid,
    .footer-grid {
      display: grid;
      gap: 1.1rem;
    }

    .hero-grid {
      grid-template-columns: minmax(0, 1.25fr) minmax(340px, 0.75fr);
      align-items: start;
    }

    .hero-grid > *,
    .gap-grid > *,
    .cost-grid > *,
    .charts-grid > *,
    .insights-grid > *,
    .footer-grid > * {
      min-width: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      color: var(--gold-light);
      background: var(--gold-soft);
      border: 1px solid var(--surface-line);
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .hero-title {
      margin: 1.25rem 0 0.5rem;
      font-size: clamp(2.6rem, 5vw, 4.7rem);
      line-height: 1.05;
      font-weight: 900;
    }

    [dir="ltr"] .hero-title,
    [dir="ltr"] .section-title {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .hero-subtitle {
      margin: 0 0 1.2rem;
      color: var(--gold-light);
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
    }

    .hero-body {
      max-width: 64ch;
      margin: 0;
      color: var(--text-muted);
      font-size: 1.08rem;
    }

    .alert-banner {
      margin-top: 1.6rem;
      border: 1px solid var(--danger);
      background: var(--danger-bg);
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      align-items: start;
    }

    .alert-icon {
      font-size: 1.4rem;
      line-height: 1;
      color: var(--danger);
    }

    .alert-text {
      display: grid;
      gap: 0.3rem;
    }

    .alert-primary {
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 700;
    }

    .alert-secondary {
      color: var(--danger);
      font-size: 0.97rem;
    }

    .summary-card .card-core {
      padding: 1.7rem;
      background:
        radial-gradient(circle at top, var(--gold-wash-10), transparent 60%),
        var(--card-bg);
    }

    .summary-caption {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.72rem;
      margin-bottom: 0.75rem;
    }

    .summary-value {
      font-family: var(--font-mono);
      font-size: clamp(2.2rem, 4vw, 3rem);
      color: var(--danger);
      font-weight: 600;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .summary-body {
      color: var(--text-muted);
      margin: 0 0 1.35rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .executive-copy {
      display: grid;
      gap: 1rem;
    }

    .executive-copy p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1.04rem;
    }

    .executive-copy p.executive-highlight {
      color: var(--gold-light);
      padding: 1rem 1.15rem;
      border-radius: 1.25rem;
      background: var(--gold-soft);
      border: 1px solid var(--surface-line);
    }

    .highlight-pills,
    .timeline-track,
    .timeline-info-grid,
    .floor-grid,
    .marketing-stats,
    .marketing-card-grid,
    .opportunities-grid,
    .investment-breakdowns {
      display: grid;
      gap: 1rem;
    }

    .highlight-pills {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 1.15rem;
    }

    .highlight-pill {
      padding: 1rem 1.1rem;
      border-radius: 1.25rem;
      background: rgba(201,169,110,0.04);
      border: 1px solid var(--surface-line);
    }

    .highlight-pill-label {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .highlight-pill-value {
      margin-top: 0.5rem;
      font-family: var(--font-mono);
      font-size: 1.25rem;
      color: var(--gold-light);
      font-weight: 600;
    }

    .timeline-shell .card-core,
    .investment-shell .card-core,
    .letter-shell .card-core {
      display: grid;
      gap: 1.2rem;
    }

    .timeline-track {
      position: relative;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding-top: 0.6rem;
    }

    .timeline-track::before {
      content: "";
      position: absolute;
      inset-inline: 4%;
      inset-block-start: 1.4rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .timeline-item {
      position: relative;
      display: grid;
      gap: 0.55rem;
      justify-items: center;
      text-align: center;
      z-index: 1;
    }

    .timeline-node {
      width: 1rem;
      height: 1rem;
      border-radius: 999px;
      border: 2px solid var(--gold-dim);
      background: var(--card-bg);
      box-shadow: 0 0 0 6px rgba(201,169,110,0.05);
    }

    .timeline-node.gold {
      border-color: var(--gold);
      background: var(--card-bg);
    }

    .timeline-node.filled {
      border-color: var(--gold);
      background: var(--gold);
      box-shadow: 0 0 0 8px rgba(201,169,110,0.08);
    }

    .timeline-node.pulse {
      border-color: var(--gold-light);
      background: var(--gold);
      animation: pulseGold 1800ms infinite var(--lux-ease);
    }

    .timeline-node.dim {
      border-color: var(--gold-dim);
      background: rgba(201,169,110,0.08);
      opacity: 0.7;
    }

    @keyframes pulseGold {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(201,169,110,0.22);
      }
      70% {
        transform: scale(1.08);
        box-shadow: 0 0 0 12px rgba(201,169,110,0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(201,169,110,0);
      }
    }

    .timeline-date {
      color: var(--gold-light);
      font-weight: 700;
    }

    .timeline-label {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .timeline-info-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .timeline-info-item {
      padding: 0.95rem 1rem;
      border-radius: 1.15rem;
      background: rgba(201,169,110,0.03);
      border: 1px solid var(--surface-line);
    }

    .timeline-info-key {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 0.25rem;
    }

    .timeline-info-value {
      color: var(--text-primary);
      font-weight: 700;
    }

    .floor-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .floor-card .card-core {
      display: grid;
      gap: 1rem;
    }

    .floor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .occupancy-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.42rem 0.75rem;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold-light);
      border: 1px solid var(--surface-line);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 0.65rem;
    }

    .unit-pill {
      padding: 0.7rem 0.55rem;
      border-radius: 0.95rem;
      border: 1px solid var(--gold-dim);
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      cursor: default;
    }

    .unit-pill.occupied {
      background: linear-gradient(180deg, rgba(201,169,110,0.22), rgba(201,169,110,0.1));
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .unit-pill.vacant {
      background: transparent;
      border-color: var(--gold-dim);
      color: var(--text-muted);
    }

    .floor-summary-pill {
      margin-top: 1.15rem;
      padding: 0.95rem 1.15rem;
      border-radius: 1.25rem;
      border: 1px solid var(--surface-line-strong);
      background: rgba(201,169,110,0.05);
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.7rem 1rem;
      color: var(--gold-light);
      font-weight: 700;
    }

    .marketing-stats {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .mini-stat-card .card-core,
    .marketing-card .card-core,
    .opportunity-card .card-core {
      display: grid;
      gap: 0.95rem;
    }

    .mini-stat-label {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .mini-stat-value {
      font-family: var(--font-mono);
      font-size: 1.4rem;
      color: var(--gold-light);
      font-weight: 600;
    }

    .marketing-card-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .marketing-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .icon-chip,
    .badge-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--surface-line);
    }

    .icon-chip {
      width: 2.2rem;
      height: 2.2rem;
      background: rgba(201,169,110,0.08);
      color: var(--gold-light);
      font-size: 1rem;
    }

    .badge-chip {
      padding: 0.35rem 0.7rem;
      background: rgba(201,169,110,0.08);
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      text-decoration: none;
      font-size: 0.9rem;
      background: transparent;
    }

    .link-button:hover {
      background: var(--gold);
      color: var(--espresso);
      transform: translateY(-1px);
    }

    .opportunities-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .opportunity-card {
      border-inline-start: 3px solid transparent;
    }

    .opportunity-card.improvement {
      border-inline-start-color: var(--gold);
    }

    .opportunity-card.gap {
      border-inline-start-color: var(--warning-light);
    }

    .opportunity-card.external {
      border-inline-start-color: var(--steel-light);
    }

    .opportunity-type {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .opportunity-type.improvement {
      color: var(--gold-light);
    }

    .opportunity-type.gap {
      color: var(--warning-light);
    }

    .opportunity-type.external {
      color: var(--steel-light);
    }

    .opportunity-body {
      display: grid;
      gap: 0.7rem;
      color: var(--text-muted);
    }

    .opportunity-line strong {
      color: var(--text-primary);
    }

    .investment-hero {
      text-align: center;
      padding: 1rem 1rem 0.4rem;
    }

    .investment-value {
      font-family: var(--font-mono);
      font-size: clamp(2.5rem, 5vw, 3.9rem);
      color: var(--gold-light);
      font-weight: 600;
      line-height: 1;
      margin-bottom: 0.7rem;
    }

    .investment-label {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .investment-subtext {
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    .investment-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.95fr) minmax(0, 1.05fr);
      gap: 1rem;
      align-items: start;
    }

    .investment-donut-card .card-core,
    .investment-break-card .card-core {
      display: grid;
      gap: 0.85rem;
    }

    .investment-breakdowns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .investment-break-value {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      color: var(--gold-light);
      font-weight: 600;
    }

    .investment-callout {
      padding: 1rem 1.15rem;
      border-radius: 1.2rem;
      border: 1px solid var(--gold);
      background: rgba(201,169,110,0.05);
      color: var(--gold-light);
    }

    .letter-shell .card-core {
      background:
        radial-gradient(circle at top, rgba(201,169,110,0.08), transparent 58%),
        var(--card-bg);
      text-align: center;
      padding: 2.3rem;
    }

    .letter-text {
      max-width: 64ch;
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }

    .letter-text p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .letter-text p.letter-opening,
    .letter-text p.letter-closing {
      color: var(--text-primary);
      font-size: 1.12rem;
      font-weight: 700;
    }

    .signature-separator {
      width: min(220px, 45%);
      height: 1px;
      margin: 0.9rem auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .signature-brand {
      color: var(--gold-light);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .signature-team {
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    .summary-tile {
      padding: 0.95rem 1rem;
      border-radius: 1.2rem;
      background: var(--gold-wash-04);
      border: 1px solid var(--surface-line);
    }

    .summary-label {
      display: block;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 0.35rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary-number {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--gold-light);
    }

    .page > section + section {
      margin-top: 2rem;
    }

    .section-header {
      margin-bottom: 0.9rem;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      line-height: 1.1;
    }

    .section-subtitle {
      margin: 0.35rem 0 0;
      color: var(--gold-light);
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.02rem;
    }

    .section-note {
      color: var(--text-muted);
      max-width: 32ch;
      font-size: 0.95rem;
      text-align: end;
    }

    .card-shell {
      background: var(--gold-wash-06);
      border: 0.5px solid var(--gold-border-soft);
      border-radius: 2rem;
      padding: 6px;
      box-shadow: 0 18px 70px var(--shadow-deep);
    }

    .card-core {
      background: var(--card-bg);
      border-radius: calc(2rem - 6px);
      padding: 2rem;
      box-shadow: inset 0 1px 1px var(--white-soft);
      height: 100%;
    }

    .gap-grid,
    .cost-grid,
    .charts-grid,
    .footer-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .single-branch-grid {

    }

    .gauge-card .card-core {

      gap: 1.25rem;
      background:

      padding-bottom: 1rem;
    }

    .branch-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--gold-light);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .branch-dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 999px;
      background: var(--branch-color);
      box-shadow: 0 0 0 4px var(--gold-wash-10);
    }

    .branch-name {
      margin: 0.45rem 0 0;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .branch-meta {
      color: var(--text-muted);
      font-size: 0.92rem;
      text-align: end;
    }

    .gauge-summary {

      gap: 1rem;
    }

    .gauge-row {
      display: grid;
      gap: 0.7rem;
    }

    .gauge-topline {

      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;

      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .gauge-percent {
      font-family: var(--font-mono);
      font-size: clamp(1.65rem, 3vw, 2.4rem);

    .gauge-percent.gold {

    }

    .gauge-percent.danger {
      color: var(--danger);
    }

      height: 1.05rem;
      border-radius: 999px;
      overflow: hidden;
      background: var(--text-surface-08);
      border: 1px solid var(--text-surface-06);
      position: relative;

      height: 100%;
      width: 100%;
      transform: scaleX(0);
      transition: transform 1000ms var(--lux-ease);
      border-radius: inherit;

      transform-origin: right center;

      transform-origin: left center;
    }

    .bar-fill.gold {
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));

    .bar-fill.danger {
      background: linear-gradient(90deg, var(--danger-wash-72), var(--danger));

      padding: 1.15rem 1.25rem;
      border-radius: 1.4rem;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border-soft);

    .loss-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .loss-value {
      margin-top: 0.45rem;
      font-family: var(--font-mono);
      font-size: clamp(1.85rem, 3vw, 2.7rem);
      color: var(--danger);
      font-weight: 600;
      line-height: 1;
    }

    .loss-caption {
      margin-top: 0.35rem;
      color: var(--danger);
      font-size: 0.95rem;
    }

    .kpi-strip {
      display: grid;
      gap: 1rem;
    }

    .kpi-row {
      position: relative;
    }

    .kpi-row::before {
      content: "";
      position: absolute;
      inset-inline-start: 0;
      inset-inline-end: 0;
      inset-block-start: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--branch-color), transparent);
    }

    .kpi-card-shell .card-core {
      padding: 1.2rem 1.15rem;
    }

    .kpi-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0 0.3rem;
    }

    .kpi-row-title {
      font-weight: 800;
      font-size: 1.25rem;
    }

    .kpi-row-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .kpi-scroll {
      display: grid;
      grid-template-columns: repeat(6, minmax(180px, 1fr));
      gap: 1rem;
      scroll-snap-type: x proximity;
    }

    .metric-card {
      height: 100%;
      scroll-snap-align: start;
    }

    .metric-label {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-height: 2.05em;
    }

    .metric-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 0.65rem;
    }

    .metric-badge {

      align-items: center;
      justify-content: center;
      padding: 0.32rem 0.62rem;
      border-radius: 999px;
      border: 1px solid var(--surface-line);
      background: rgba(201,169,110,0.08);
      color: var(--gold-light);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .metric-value {
      margin-top: 0.75rem;
      font-family: var(--font-mono);
      font-size: 1.32rem;
      font-weight: 600;
      line-height: 1.15;
    }

    .metric-foot {
      margin-top: 0.55rem;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .metric-loss .card-core {
      background:
        linear-gradient(180deg, var(--danger-bg-faint), transparent 45%),
        var(--card-bg);
      border: 1px solid var(--danger-border-faint);
    }

    .metric-loss .metric-value,
    .metric-loss .metric-foot {
      color: var(--danger);
    }

    .comparison-card .card-core,
    .chart-card .card-core,
    .cost-card .card-core,
    .insight-card .card-core {
      display: grid;
      gap: 1.2rem;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 1.4rem;
      border: 1px solid var(--surface-line);
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
    }

    th,
    td {
      padding: 1rem 0.95rem;
      border-bottom: 1px solid var(--surface-line);
      text-align: start;
      vertical-align: top;

    thead th {

      color: var(--gold-light);
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: rgba(201,169,110,0.04);
    }

    tbody td {
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .mono {
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .muted {
      color: var(--text-muted);
    }

    .branch-badge,
    .status-badge,
    .arrow-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border-radius: 999px;
      padding: 0.38rem 0.72rem;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .branch-badge {
      background: var(--gold-wash-10);
      color: var(--gold-light);
      border-color: var(--surface-line);
    }

    .status-badge.danger,
    .arrow-badge.danger {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger-border-strong);

    .status-badge.warning,
    .arrow-badge.warning {
      color: var(--warning);
      background: var(--warning-bg-soft);
      border-color: var(--warning-border-soft);
    }

    .chart-stage {
      display: grid;
      gap: 1rem;
      min-height: 300px;
    }

    .chart-stage canvas {
      width: 100%;
      height: 100%;
      min-height: 250px;
    }

    .chart-note,
    .chart-fallback {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .gap-indicator {
      padding: 0.95rem 1.1rem;
      border-radius: 1.2rem;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border-mid);
      color: var(--danger);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;

    .gap-indicator strong {

      color: var(--danger);

    .cost-summary-grid {

    .cost-summary-value {

      font-size: 1.45rem;
      color: var(--gold-light);
      font-weight: 600;

    .cost-layout {

      grid-template-columns: minmax(280px, 0.95fr) minmax(0, 1.05fr);
      gap: 1rem;
      align-items: start;
    }

    .cost-donut-card .card-core {
      display: grid;
      gap: 0.9rem;
    }

    .chart-fallback[hidden] {
      display: none;
    }

    .subtable {
      border: 1px solid var(--surface-line);
      border-radius: 1.4rem;
      overflow: hidden;
      background: var(--gold-wash-025);
    }

    .subtable-head {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--surface-line);
      color: var(--gold-light);
      font-weight: 700;
    }

    }

    .subtable td,
    .subtable th {
      padding: 0.82rem 1rem;
    }

    .subtable tr.total-row td {
      border-top: 1px solid var(--gold-dim);
      font-weight: 700;
      color: var(--gold-light);
    }

    .cost-bridge {
      display: grid;
      gap: 0.65rem;
      padding: 1rem 1.1rem;
      border-radius: 1.3rem;
      background: var(--danger-bg-soft);
      border: 1px solid var(--danger-border-mid);
    }

    .cost-bridge-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .bridge-track {
      position: relative;
      height: 1.15rem;
      border-radius: 999px;
      background: var(--text-surface-08);
      overflow: hidden;
      border: 1px solid var(--text-surface-06);
    }

    .bridge-commission,
    .bridge-gap {
      position: absolute;
      inset-block: 0;
      transform: scaleX(0);
      transition: transform 1100ms var(--lux-ease);
    }

    .bridge-commission {
      inset-inline-start: 0;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    }

    .bridge-gap {
      background: linear-gradient(90deg, var(--danger-wash-70), var(--danger));
    }

    [dir="rtl"] .bridge-commission,
    [dir="rtl"] .bridge-gap {
      transform-origin: right center;
    }

    [dir="ltr"] .bridge-commission,
    [dir="ltr"] .bridge-gap {
      transform-origin: left center;
    }

    .is-visible .bridge-commission {
      transform: scaleX(var(--commission-scale));
    }

    .is-visible .bridge-gap {
      transform: scaleX(var(--gap-scale));
    }

    .bridge-foot {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--danger);
      font-size: 0.88rem;
    }

    .insights-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .insight-card .card-core {
      background:
        linear-gradient(180deg, var(--gold-wash-06), transparent 40%),

    }

    .card-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .card-badge.danger {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger-border-strong);
    }

    .card-badge.warning {
      color: var(--warning);
      background: var(--warning-bg-mid);
      border-color: var(--warning-border-mid);
    }

    .card-badge.gold {
      color: var(--gold-light);
      background: var(--gold-wash-10);
      border-color: var(--surface-line);
    }

    .insight-title {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.2;
    }

    .insight-body {
      margin: 0;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .footer-card .card-core {
      padding: 1.4rem 1.6rem;
    }

    .footer-brand {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gold-light);
    }

    .footer-meta {
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition:
        opacity 800ms var(--lux-ease),
        transform 800ms var(--lux-ease);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stagger-grid > :nth-child(2) {
      transition-delay: 120ms;
    }

    .stagger-grid > :nth-child(3) {
      transition-delay: 240ms;
    }

    .stagger-grid > :nth-child(4) {
      transition-delay: 360ms;
    }

    .screen-only {
      display: block;
    }

    .print-only {
      display: none;
    }

    @media (max-width: 1024px) {
      .hero-grid,
      .gap-grid,
      .cost-grid,
      .charts-grid,

        position: absolute;

        inset-block-start: 0.35rem;
      }

      .kpi-scroll {
        grid-auto-flow: column;
        grid-auto-columns: minmax(200px, 78vw);
        overflow-x: auto;
        padding-bottom: 0.35rem;
        padding-inline-end: 0.2rem;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
        gap: 0.85rem;
      }

      .metric-value {
        font-size: 1.18rem;
      }

      .table-wrap {
        margin-inline: -0.15rem;
        border-radius: 1.1rem;
      }

      th,
      td {
        padding: 0.8rem 0.72rem;
      }

      table {
        min-width: 940px;
      }

      .chart-stage {
        min-height: 240px;
      }

      .chart-stage canvas {
        min-height: 210px;
      }

      .subtable-head {
        padding: 0.8rem 0.9rem;
      }

      .subtable td,
      .subtable th {
        padding: 0.72rem 0.85rem;
      }

      .footer-meta {
        font-size: 0.9rem;
      }

      .letter-shell .card-core {
        padding: 1.55rem;
      }

      .section-header,
      .branch-header,
      .gauge-topline,
      .kpi-row-head,
      .cost-bridge-head,
      .metric-head,
      .bridge-foot,
      .card-badge-row {
        flex-direction: column;
        align-items: start;
      }

      .branch-meta {
        text-align: start;
      }
    }

    @media print {
      :root {
        --espresso: var(--print-bg);
        --card-bg: var(--print-bg);
        --text-primary: var(--print-text);
        --text-muted: var(--print-muted);
        --surface-line: var(--print-line);
        --surface-line-strong: var(--print-line-strong);
        --white-soft: rgba(0,0,0,0);
        --shadow-deep: rgba(0,0,0,0);
        --hero-radial-1: rgba(0,0,0,0);
        --hero-radial-2: rgba(0,0,0,0);
        --grid-accent: var(--print-grid);
      }

      body {
        background: var(--print-bg);
        color: var(--print-text);
      }

      body::before,
      .lang-toggle,
      .screen-only {
        display: none !important;
      }

      .print-only {
        display: block;
      }

      .page {
        width: 100%;
        padding: 0;
      }

      .card-shell {
        box-shadow: none;
      }

      .reveal {
        opacity: 1 !important;
        transform: none !important;
      }

      .chart-card canvas,
      .chart-fallback,
      .chart-note {
        display: none !important;
      }

      .hero-grid,
      .gap-grid,
      .cost-grid,
      .charts-grid,
      .investment-layout,
      .insights-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      table,
      .subtable table {
        min-width: 100%;
      }
    }
  </style>
</head>

    function formatNumber(value) {
      return Math.round(value).toLocaleString("en-SA");
    }

    function formatPlain(value, decimals) {
      return Number(value).toLocaleString("en-SA", {
        minimumFractionDigits: decimals || 0,
        maximumFractionDigits: decimals || 0
      });
    }

    function formatCurrency(value) {
      const sign = value < 0 ? "−" : "";
      return sign + formatNumber(Math.abs(value)) + " SAR";
    }

    function formatPercent(value, decimals) {
      const sign = value < 0 ? "−" : "";
      return sign + (Math.abs(value) * 100).toLocaleString("en-SA", {
        minimumFractionDigits: decimals || 0,
        maximumFractionDigits: decimals || 0
      }) + "%";
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

      return DATA.copy[state.lang];

    function getBranchGap(branch) {
      return branch.commissionTotal - branch.totalCosts;
    }

    function getCoverageRatio(branch) {
      return branch.commissionTotal / branch.totalCosts;
    }

    function getGapRatio(branch) {
      return Math.abs(getBranchGap(branch)) / branch.totalCosts;
    }

    function getFloorStats(floor) {
      const occupied = floor.units.filter(function (unit) {
        return unit.occupied;
      }).length;
      const total = floor.units.length;
      return {
        occupied: occupied,
        vacant: total - occupied,
        total: total
      };
    }

    function getPortfolioStats() {
      const occupied = DATA.floors.reduce(function (sum, floor) {
        return sum + getFloorStats(floor).occupied;
      }, 0);
      const total = DATA.floors.reduce(function (sum, floor) {
        return sum + floor.units.length;
      }, 0);
      return {
        occupied: occupied,
        vacant: total - occupied,
        total: total,
        occupancyRate: occupied / total
      };
    }

                      '<th>' + escapeHtml(copy.labels.expectedRevenue) + '</th>' +
                      '<th>' + escapeHtml(copy.labels.totalRevenue) + '</th>' +

    function buildChartPrintTable(copy) {
      return '' +
        '<div class="print-only">' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead>' +
                '<tr>' +
                  '<th>' + escapeHtml(copy.labels.branch) + '</th>' +
                  '<th>' + escapeHtml(copy.labels.commissionAmount) + '</th>' +
                  '<th>' + escapeHtml(copy.labels.totalCosts) + '</th>' +
                  '<th>' + escapeHtml(copy.labels.directCosts) + '</th>' +
                  '<th>' + escapeHtml(copy.labels.indirectCosts) + '</th>' +

              '</thead>' +
              '<tbody>' +
                DATA.branches.map(function (branch) {

                    '<tr>' +
                      '<td>' + escapeHtml(branch.name[state.lang]) + '</td>' +
                      '<td class="mono">' + formatCurrency(branch.commissionTotal) + '</td>' +
                      '<td class="mono">' + formatCurrency(branch.totalCosts) + '</td>' +
                      '<td class="mono">' + formatCurrency(branch.directCosts.subtotal) + '</td>' +
                      '<td class="mono">' + formatCurrency(branch.indirectCosts.subtotal) + '</td>' +
                      '<td class="mono">' + formatPercent(branch.netMargin) + '</td>' +
                    '</tr>';
                }).join("") +
              '</tbody>' +
            '</table>' +

          '<p class="chart-note">' + escapeHtml(copy.labels.printFallback) + '</p>' +
        '</div>';
    }

    function buildChartsSection(copy) {
      const branch = DATA.branches[0];
      return '' +
        '<section>' +
          buildSectionHeader(copy.sections.chartsTitle, copy.sections.chartsSubtitle, "") +
          '<div class="card-shell chart-card reveal">' +

                '<h3 class="insight-title">' + escapeHtml(copy.labels.groupedBars) + '</h3>' +

    function buildCostRows(items, subtotal, labels, copy) {
      const keys = Object.keys(items).filter(function (key) { return key !== "subtotal"; });
      const rows = keys.map(function (key) {

    function buildCostSection(copy) {

                '<h3 class="insight-title">' + escapeHtml(copy.sections.costsSubtitle) + '</h3>' +

    function buildInsightsSection(copy) {

                '<p>' + escapeHtml(copy.ownerLetter.body) + '</p>' +

                '<div class="signature-separator"></div>' +

    function buildFooter(copy) {
      const secondaryPrepared = copy.footer.preparedEn !== copy.footer.preparedAr

        '<footer style="margin-top:2rem;">' +
          '<div class="footer-grid">' +

              '<div class="card-core">' +

    function renderApp() {
      const copy = getCopy();
      document.documentElement.lang = copy.lang;
      document.documentElement.dir = copy.dir;
      document.getElementById("langToggle").textContent = copy.toggle;

      const html = '' +
        '<div class="page">' +
          buildHero(copy) +
          buildKpiSection(copy) +
          buildExecutiveSummary(copy) +
          buildContractTimeline(copy) +
          buildFloorDistributionSection(copy) +
          buildMarketingSection(copy) +
          buildGapSection(copy) +
          buildComparisonSection(copy) +
          buildChartsSection(copy) +
          buildCostSection(copy) +
          buildOpportunitiesSection(copy) +
          buildInvestmentSection(copy) +
          buildInsightsSection(copy) +
          buildLetterSection(copy) +
          buildFooter(copy) +
        '</div>';

      document.getElementById("app").innerHTML = html;
      initObservers();
      initCharts();
    }

    function destroyCharts() {
      state.charts.forEach(function (chart) {
        chart.destroy();
      });
      state.charts = [];
    }

    function getCssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function chartLabelColor() {
      return getCssVar("--gold-light");
    }

    function baseChartOptions() {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
          duration: 1200,
          easing: "easeOutQuart"
        },
        plugins: {
          legend: {
            labels: {
              color: chartLabelColor(),
              font: {
                family: "Tajawal"
              }
            }
          },
          tooltip: {
            backgroundColor: getCssVar("--card-elevated"),
            titleColor: getCssVar("--gold-light"),
            bodyColor: getCssVar("--text-primary"),
            borderColor: getCssVar("--surface-line-strong"),
            borderWidth: 1,
            callbacks: {
              label: function (context) {
                return context.dataset.label + ": " + formatCurrency(context.parsed.y ?? context.parsed);
              }
            }
          }
        }
      };
    }

    function initCharts() {
      destroyCharts();

      if (!window.Chart) {
        ["chartFallbackA", "chartFallbackB"].forEach(function (id) {
          const node = document.getElementById(id);
          if (node) {
            node.hidden = false;
          }
        });
        return;
      }

      Chart.defaults.color = chartLabelColor();
      Chart.defaults.borderColor = "transparent";
      Chart.defaults.font.family = "Tajawal";

      const copy = getCopy();
      const branchLabels = DATA.branches.map(function (branch) {
        return branch.name[state.lang];
      });

      const commissionCostCtx = document.getElementById("commissionCostChart");
      if (commissionCostCtx) {
        state.charts.push(new Chart(commissionCostCtx, {
          type: "bar",
          data: {
            labels: branchLabels,
            datasets: [
              {
                label: copy.labels.commissionAmount,
                data: DATA.branches.map(function (branch) { return branch.commissionTotal; }),
                backgroundColor: getCssVar("--gold"),
                borderRadius: 14
              },
              {
                label: copy.labels.totalCosts,
                data: DATA.branches.map(function (branch) { return branch.totalCosts; }),
                backgroundColor: getCssVar("--danger"),
                borderRadius: 14
              }
            ]
          },
          options: Object.assign(baseChartOptions(), {
            scales: {
              x: {
                grid: {
                  display: false
                },
                ticks: {
                  color: chartLabelColor()
                }
              },
              y: {
                grid: {
                  color: "transparent"
                },
                ticks: {
                  color: chartLabelColor(),
                  callback: function (value) {
                    return formatNumber(value);
                  }
                }
              }
            }
          })
        }));
      }

      const costBreakdownCtx = document.getElementById("costBreakdownChart");
      if (costBreakdownCtx) {
        state.charts.push(new Chart(costBreakdownCtx, {
          type: "bar",
          data: {
            labels: branchLabels,
            datasets: [
              {
                label: copy.labels.directCosts,
                data: DATA.branches.map(function (branch) { return branch.directCosts.subtotal; }),
                backgroundColor: getCssVar("--gold-dim"),
                borderRadius: 14,
                stack: "costs"
              },
              {
                label: copy.labels.indirectCosts,
                data: DATA.branches.map(function (branch) { return branch.indirectCosts.subtotal; }),
                backgroundColor: getCssVar("--chart-indirect"),
                borderColor: getCssVar("--gold-light"),
                borderWidth: 1,
                borderRadius: 14,
                stack: "costs"
              }
            ]
          },
          options: Object.assign(baseChartOptions(), {
            scales: {
              x: {
                stacked: true,
                grid: {
                  display: false
                },
                ticks: {
                  color: chartLabelColor()
                }
              },
              y: {
                stacked: true,
                grid: {
                  color: "transparent"
                },
                ticks: {
                  color: chartLabelColor(),
                  callback: function (value) {
                    return formatNumber(value);
                  }
                }
              }
            }
          })
        }));
      }

      const costCompositionCtx = document.getElementById("costCompositionChart");
      if (costCompositionCtx) {
        state.charts.push(new Chart(costCompositionCtx, {
          type: "doughnut",
          data: {
            labels: [
              copy.labels.directCosts,
              copy.labels.indirectCosts
            ],
            datasets: [
              {
                data: [
                  DATA.branches[0].directCosts.subtotal,
                  DATA.branches[0].indirectCosts.subtotal
                ],
                backgroundColor: [
                  getCssVar("--gold"),
                  getCssVar("--gold-dim")
                ],
                borderColor: getCssVar("--card-bg"),
                borderWidth: 6,
                hoverOffset: 6
              }
            ]
          },
          options: Object.assign(baseChartOptions(), {
            cutout: "62%",
            plugins: {
              legend: {
                labels: {
                  color: chartLabelColor(),
                  font: {
                    family: "Tajawal"
                  }
                }
              },
              tooltip: {
                backgroundColor: getCssVar("--card-elevated"),
                titleColor: getCssVar("--gold-light"),
                bodyColor: getCssVar("--text-primary"),
                borderColor: getCssVar("--surface-line-strong"),
                borderWidth: 1,
                callbacks: {
                  label: function (context) {
                    return context.label + ": " + formatCurrency(context.parsed);
                  }
                }
              }
            }
          })
        }));
      }

      const investmentDonutCtx = document.getElementById("investmentDonutChart");
      if (investmentDonutCtx) {
        state.charts.push(new Chart(investmentDonutCtx, {
          type: "doughnut",
          data: {
            labels: [
              copy.labels.directInvestment,
              copy.labels.indirectInvestment
            ],
            datasets: [
              {
                data: [
                  DATA.investment.direct,
                  DATA.investment.indirect
                ],
                backgroundColor: [
                  getCssVar("--gold"),
                  getCssVar("--gold-dim")
                ],
                borderColor: getCssVar("--card-bg"),
                borderWidth: 6,
                hoverOffset: 6
              }
            ]
          },
          options: Object.assign(baseChartOptions(), {
            cutout: "62%",
            plugins: {
              legend: {
                labels: {
                  color: chartLabelColor(),
                  font: {
                    family: "Tajawal"
                  }
                }
              },
              tooltip: {
                backgroundColor: getCssVar("--card-elevated"),
                titleColor: getCssVar("--gold-light"),
                bodyColor: getCssVar("--text-primary"),
                borderColor: getCssVar("--surface-line-strong"),
                borderWidth: 1,
                callbacks: {
                  label: function (context) {
                    return context.label + ": " + formatCurrency(context.parsed);
                  }
                }
              }
            }
          })
        }));
      }
    }

    function animateCount(element) {
      const target = Number(element.dataset.target);
      const format = element.dataset.format;
      const duration = 1500;
      const start = performance.now();

      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        const value = target * eased;

        if (format === "currency") {
          element.textContent = formatCurrency(value);
        } else if (format === "percent") {
          element.textContent = formatPercent(value);
        } else if (format === "percent1") {
          element.textContent = formatPercent(value, 1);
        } else if (format === "plain") {
          element.textContent = formatPlain(value);
        } else {
          element.textContent = formatNumber(value);
        }

        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          if (format === "currency") {
            element.textContent = formatCurrency(target);
          } else if (format === "percent") {
            element.textContent = formatPercent(target);
          } else if (format === "percent1") {
            element.textContent = formatPercent(target, 1);
          } else if (format === "plain") {
            element.textContent = formatPlain(target);
          } else {
            element.textContent = formatNumber(target);
          }
        }
      }

      requestAnimationFrame(tick);
    }

    function initObservers() {
      if (state.revealObserver) {
        state.revealObserver.disconnect();
      }
      if (state.countObserver) {
        state.countObserver.disconnect();
      }

      state.revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            state.revealObserver.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.18
      });

      state.countObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting && !entry.target.dataset.counted) {
            entry.target.dataset.counted = "true";
            animateCount(entry.target);
            state.countObserver.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.3
      });

      document.querySelectorAll(".reveal").forEach(function (node) {
        state.revealObserver.observe(node);
      });

      document.querySelectorAll(".countup").forEach(function (node) {
        state.countObserver.observe(node);
      });
    }

    document.getElementById("langToggle").addEventListener("click", function () {
      state.lang = state.lang === "ar" ? "en" : "ar";
      renderApp();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderApp();
  </script>
